<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · Kal Crush</title>
<meta name="theme-color" content="#06140d">
<style>
  :root{--leaf:#7EE2A8;--mist:#A9C7B5;--gold:#FFC83D}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#06140d;color:#E8F5EC;
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(1200px 600px at 50% -10%,#123a28 0%,#06140d 60%)}
  .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 14px 28px}
  .top{text-align:center;max-width:760px}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:15px;color:#fff;opacity:.9}
  .brand i{width:26px;height:26px;border-radius:8px;display:inline-block;
    background:linear-gradient(135deg,#14B8A6,#2B7BE0 55%,#1E3F9E);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
  .badge{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    color:var(--leaf);background:rgba(126,226,168,.08);border:1px solid rgba(126,226,168,.25);padding:6px 12px;border-radius:999px}
  .badge b{width:8px;height:8px;border-radius:50%;background:#ff6b5b;box-shadow:0 0 10px #ff6b5b}
  h1{font-size:clamp(24px,4.2vw,40px);line-height:1.1;margin:12px 0 6px;letter-spacing:-.025em}
  .sub{margin:0;color:var(--mist)}
  .stage{position:relative;width:100%;max-width:980px;aspect-ratio:16/7;border-radius:22px;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;background:#0b2a1d}
  @media (max-width:640px){.stage{aspect-ratio:4/3}}
  canvas{display:block;width:100%;height:100%}
  .btn{position:absolute;bottom:14px;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    background:rgba(6,20,13,.45);color:#fff;font-size:26px;display:none;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
  .btn.left{left:14px}.btn.right{right:14px}
  .touch .btn{display:flex}
  .btn:active{background:rgba(126,226,168,.35)}
  .mute{position:absolute;top:10px;right:12px;display:none}
  .icon{background:rgba(6,20,13,.45);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;font-size:13px;padding:5px 10px;cursor:pointer}
  .brand img{border-radius:8px}
  .retry{margin-top:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#E8F5EC;font:600 14px system-ui,sans-serif;border-radius:999px;padding:8px 16px;cursor:pointer}
  .retry:hover{background:rgba(255,255,255,.12)}
  .help{color:#8FB39D;font-size:14px;text-align:center;margin:0}
  kbd{font:600 12px/1 system-ui,sans-serif;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-bottom-width:2px;border-radius:6px;padding:3px 7px;color:#E8F5EC}
  .online{position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);transition:transform .35s ease;z-index:9;
    background:#fff;color:#0B1220;border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;font-weight:600;
    box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .online.show{transform:translate(-50%,0)}
  .online button{border:0;background:#1D5FD1;color:#fff;font-weight:700;border-radius:999px;padding:8px 14px;cursor:pointer}
</style>

/* ---------- audio ---------- */
let AC = null, muted = false;

function tone(f1, f2, dur, type='square', vol=.08, delay=0){

  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);

  for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); f.type='lowpass'; f.frequency.value=lp; g.gain.value=vol;

};

/* ---------- game state ---------- */
const P = { x:0, y:GROUND, vy:0, duck:false, air:false, hold:false, phase:0, inv:0, buf:0 };
let state = 'ready', speed = 0, dist = 0, time = 0, gap = 1, obs = [], fruits = [], parts = [], nextObs = 0, nextFruit = 0;
let shake = 0, caughtT = 0, beatT = 0, flash = 0, scroll = 0, newBest = false, pops = [], chirpT = 3, leafT = 0, bestShown = false;
const keys = { duck:false };

function reset(){
  P.y = GROUND; P.vy = 0; P.air = false; P.duck = false; P.inv = 0; P.phase = 0;
  speed = 360; dist = 0; time = 0; gap = 1; obs = []; fruits = []; parts = []; nextObs = 520; nextFruit = 900;
  shake = 0; caughtT = 0; flash = 0; newBest = false; pops = []; bestShown = false;
}
reset();

function start(){ audio(); if (state !== 'play') { reset(); state = 'play'; } }
function jump(){
  if (state === 'paused') { state = 'play'; last = performance.now(); return; }
  if (state !== 'play') { if (state === 'over' && caughtT < .9) return; start(); return; }
  P.hold = true; P.buf = .14; tryJump();
}
function tryJump(){ if (P.buf > 0 && !P.air){ P.buf = 0; P.vy = -900; P.air = true; sfx.jump(); dust(P.x, GROUND, 6); if (!P.hold) P.vy = -560; } }
function popup(text, x, y, col){ pops.push({ text, x, y, col, t: 0 }); }

/* ---------- spawning ---------- */
function spawnObstacle(){
  const t = time, r = R();
  let o;
  if (t > 9 && r < .2) o = { kind:'branch', w:92, y:GROUND-200, h:150 };              // slide under (bottom at GROUND-50)
  else if (t > 18 && r < .34) { const low = R() < .6;
    o = { kind:'bird', w:46, h:28, y: low ? GROUND-82 : GROUND-150, flap:R()*6, vxOff: 60 }; }
  else if (t > 14 && r < .48) o = { kind:'thorn', w:66, h:46, y:GROUND-46 };
  else if (t > 6 && r < .62) o = { kind:'log2', w:124, h:34, y:GROUND-34 };
  else if (r < .82) o = { kind:'log', w:62, h:34, y:GROUND-34 };
  else o = { kind:'rock', w:46, h:40, y:GROUND-40 };
  o.x = W + 40; obs.push(o);
  const minGap = speed*.72 + 240;
  nextObs = minGap + R()*(speed*.85 + 120) + (o.kind === 'log2' ? 60 : 0);
}
function spawnFruit(){
  fruits.push({ x: W + 40, y: GROUND - 95 - R()*70, t: R()*6 });
  nextFruit = 900 + R()*900;
}
function dust(x,y,n){ for (let i=0;i<n;i++) parts.push({ x, y, vx:-60-R()*120, vy:-R()*90, life:.5+R()*.3, t:0, kind:'dust' }); }
function sparkle(x,y){ for (let i=0;i<14;i++){ const a=R()*Math.PI*2, v=80+R()*160; parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:.6, t:0, kind:'spark' }); } }

/* ---------- update ---------- */
function hitbox(){ const h = P.duck && !P.air ? 32 : 64, w = P.duck && !P.air ? 46 : 28; return { x:P.x-w/2, y:P.y-h, w, h }; }
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function obBox(o){
  if (o.kind === 'branch') return { x:o.x+6, y:GROUND-118, w:o.w-12, h:68 };
  if (o.kind === 'bird') return { x:o.x+6, y:o.y+4, w:o.w-12, h:o.h-8 };
  return { x:o.x+6, y:o.y+6, w:o.w-12, h:o.h-6 };
}
function update(dt){
  time += dt; flash = Math.max(0, flash - dt*2); shake = Math.max(0, shake - dt*3);
  P.x = Math.min(W*.36, 250);
  if (state === 'play'){
    speed = Math.min(940, 360 + time*10.5);
    const dx = speed*dt; dist += dx; scroll += dx;
    // monster pressure
    gap -= dt * (0.019 + time*0.00012);
    if (gap < .28) { beatT -= dt; if (beatT <= 0) { sfx.beat(); beatT = lerp(.45,.95,gap/.28); } }
    // player physics
    P.duck = keys.duck;
    if (P.air){ P.vy += (keys.duck ? 5200 : 2700)*dt; P.y += P.vy*dt;
      if (P.y >= GROUND){ P.y = GROUND; P.vy = 0; P.air = false; dust(P.x, GROUND, 5); } }
    if (P.buf > 0){ P.buf -= dt; tryJump(); }
    chirpT -= dt; if (chirpT <= 0){ sfx.chirp(); chirpT = 2.5 + R()*4; }
    const m = Math.floor(dist/40); if (!bestShown && best > 30 && m > best){ bestShown = true; popup('NEW BEST!', W/2, 70, '#FFC83D'); sfx.fruit(); }
    P.phase += dt * speed / 26; P.inv = Math.max(0, P.inv - dt);
    // spawn
    nextObs -= dx; if (nextObs <= 0) spawnObstacle();
    nextFruit -= dx; if (nextFruit <= 0) spawnFruit();
    const hb = hitbox();
    for (const o of obs){ o.x -= dx + (o.kind === 'bird' ? 90*dt : 0);
      if (o.kind === 'bird') o.flap += dt*14;
      if (!o.hit && P.inv <= 0 && overlap(hb, obBox(o))){ o.hit = true; P.inv = 1.1; gap -= .42; shake = 1; flash = 1; sfx.hit(); dust(P.x, P.y-20, 10); popup('Ouch!', P.x, P.y - 80, '#FF7B6E'); } }
    obs = obs.filter(o => o.x + o.w > -60);
    for (const f of fruits){ f.x -= dx; f.t += dt;
      if (!f.got && overlap(hb, { x:f.x-14, y:f.y-14, w:28, h:28 })){ f.got = true; gap = Math.min(1, gap + .2); sfx.fruit(); sparkle(f.x, f.y); popup('+ Mango', f.x, f.y - 18, '#FFD86B'); } }
    fruits = fruits.filter(f => f.x > -40 && !f.got);
    if (gap <= 0){ gap = 0; state = 'over'; caughtT = 0; shake = 1.4; sfx.roar();
      const m = Math.floor(dist/40); if (m > best){ best = m; newBest = true; try { localStorage.setItem('kc_jungle_best', best); } catch(e){} } }
  } else if (state === 'over'){
    caughtT += dt;
  } else if (state === 'paused'){ return; } else { P.phase += dt*6; scroll += dt*40; }
  leafT -= dt; if (leafT <= 0 && state !== 'over'){ leafT = .35 + R()*.6;
    parts.push({ x: R()*W*1.2, y: -10, vx: -20 - R()*30, vy: 30 + R()*25, life: 7, t: 0, kind: 'leaf', rot: R()*6, vr: (R()-.5)*3, c: R() }); }
  for (const p of parts){ p.t += dt;
    if (p.kind === 'leaf'){ p.x += (p.vx + Math.sin(p.t*2 + p.c*6)*25 - (state==='play' ? speed*.5 : 10))*dt; p.y += p.vy*dt; p.rot += p.vr*dt; if (p.y > GROUND) p.t = p.life; continue; }
    p.x += (p.vx - (state==='play'?speed*.3:0))*dt; p.y += p.vy*dt; p.vy += 260*dt; }
  for (const q of pops) q.t += dt; pops = pops.filter(q => q.t < 1.1);
  parts = parts.filter(p => p.t < p.life);
}

/* ---------- drawing ---------- */
function night(){ return .5 - .5*Math.cos(dist/40/900*Math.PI*2); }      // full day/night cycle every 900 m
function drawSky(){

  const r=Math.round(lerp(pa>>16,pb>>16,t)), g=Math.round(lerp(pa>>8&255,pb>>8&255,t)), bl=Math.round(lerp(pa&255,pb&255,t));

/* ---------- character art: prerendered, shaded sprite frames ---------- */
function hexRgb(h){ const n = parseInt(h.slice(1),16); return [n>>16, n>>8&255, n&255]; }
function shade(h, a){ const [r,g,b] = hexRgb(h);
  const f = a < 0 ? v => Math.round(v*(1+a)) : v => Math.round(v + (255-v)*a);
  return `rgb(${f(r)},${f(g)},${f(b)})`; }
const OUTLINE = 'rgba(16,9,5,.6)';
const jp = (x, y, a, l) => [x + Math.sin(a)*l, y + Math.cos(a)*l];   // angle 0 = straight down, + = forward (right)

// tapered capsule with light from above
function limb(g, x1, y1, x2, y2, r1, r2, col, line = .9){
  const a = Math.atan2(y2-y1, x2-x1);
  let nx = -Math.sin(a), ny = Math.cos(a); if (ny > 0){ nx = -nx; ny = -ny; }
  const mx = (x1+x2)/2, my = (y1+y2)/2, rr = Math.max(r1, r2);
  const gr = g.createLinearGradient(mx+nx*rr, my+ny*rr, mx-nx*rr, my-ny*rr);
  gr.addColorStop(0, shade(col, .3)); gr.addColorStop(.42, col); gr.addColorStop(1, shade(col, -.42));
  g.beginPath(); g.arc(x1, y1, r1, a + Math.PI/2, a + Math.PI*1.5); g.arc(x2, y2, r2, a - Math.PI/2, a + Math.PI/2); g.closePath();

  const gr = g.createRadialGradient(x + rx*lightX, y + ry*lightY, 1, x, y, Math.max(rx, ry)*1.15);
  gr.addColorStop(0, shade(col, .32)); gr.addColorStop(.5, col); gr.addColorStop(1, shade(col, -.45));
  g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI*2); g.fillStyle = gr; g.fill();
  if (line){ g.strokeStyle = OUTLINE; g.lineWidth = line; g.stroke(); }

/* ===== the explorer ===== */
const MAN = { skin:'#c98a5c', shirt:'#5f7d40', pants:'#b59c69', boot:'#5b3a21', hat:'#dcc089', band:'#5e3f20',
              pack:'#7d5632', roll:'#56708c', scarf:'#b8382c', hair:'#2a1a10', canteen:'#8a9a6a' };
function manPose(kind, p){
  const s = Math.sin(p), c = Math.cos(p);
  if (kind === 'run') return { hipY: -30.5 - 2.4*Math.abs(c), lean: .26,
    tF: .08 + .85*s, bF: .2 + 1.55*Math.max(0, c), tB: .08 - .85*s, bB: .2 + 1.55*Math.max(0, -c),
    aF: .15 - 1.0*s, eF: 1.6, aB: .15 + 1.0*s, eB: 1.6, head: -.12 };
  if (kind === 'jump') return { hipY: -31, lean: .18, tF: 1.3, bF: 1.75, tB: -.4, bB: 1.05, aF: 2.2, eF: .9, aB: -.8, eB: 1.2, head: -.15 };
  if (kind === 'fall') return { hipY: -31, lean: .1, tF: .75, bF: .55, tB: -.15, bB: .75, aF: 2.6, eF: .5, aB: 2.0, eB: .7, head: -.05 };

}
function drawMan(g, P){
  const C = MAN, hip = [0, P.hipY];
  const up = [Math.sin(P.lean), -Math.cos(P.lean)], back = [-Math.cos(P.lean), -Math.sin(P.lean)];

  const leg = (tA, bend, far) => {
    const k = jp(hip[0], hip[1], tA, 14.5), shA = tA - bend, an = jp(k[0], k[1], shA, 14), fA = shA + 1.5, toe = jp(an[0], an[1], fA, 8.5);
    const pc = far ? shade(C.pants, -.3) : C.pants, bc = far ? shade(C.boot, -.3) : C.boot;
    limb(g, hip[0], hip[1], k[0], k[1], 5.6, 4.5, pc);
    limb(g, k[0], k[1], an[0], an[1], 4.5, 3.7, pc);
    if (!far){ g.fillStyle = 'rgba(70,50,25,.35)'; g.beginPath(); g.ellipse(k[0], k[1], 3.2, 2.2, shA, 0, Math.PI*2); g.fill(); }

    limb(g, cuff[0], cuff[1], h[0], h[1], 3.0, 2.6, kc);
    blob(g, h[0] + Math.sin(fA)*1.5, h[1] + Math.cos(fA)*1.5, 3.1, 3.1, 0, kc, .3, -.5, .7);

  limb(g, 0, -8, 0, 7, 6.2, 6.0, C.pack); g.fillStyle = shade(C.pack, -.25); g.beginPath(); g.ellipse(0, -5, 6.3, 3.2, 0, Math.PI, 0); g.fill();
  limb(g, -6.5, -12, 6.5, -12, 3.6, 3.6, C.roll); g.strokeStyle = 'rgba(30,20,10,.6)'; g.lineWidth = .8;
  g.beginPath(); g.moveTo(-2,-15.5); g.lineTo(-2,-8.5); g.moveTo(3,-15.5); g.lineTo(3,-8.5); g.stroke();
  blob(g, -5.5, 6, 3.2, 4.2, 0, C.canteen, .3, -.5, .7);
  g.restore();
  // hips
  limb(g, hip[0] + back[0]*3.5, hip[1] + back[1]*3.5, hip[0] - back[0]*3.5, hip[1] - back[1]*3.5, 5.8, 5.8, C.pants);
  leg(P.tF, P.bF, false);
  // torso (shirt) as a tapered body
  { const pw = [-up[1], up[0]];   // perpendicular, points forward
    const pts = [[hip[0] - pw[0]*6, hip[1] - pw[1]*6], [hip[0] + pw[0]*5.5, hip[1] + pw[1]*5.5],
                 [neck[0] + pw[0]*5.5 - up[0]*1, neck[1] + pw[1]*5.5 - up[1]*1], [neck[0] - pw[0]*7.5, neck[1] - pw[1]*7.5]];

    g.beginPath(); g.moveTo(...pts[0]); g.lineTo(...pts[1]); g.quadraticCurveTo(hip[0] + pw[0]*8 + up[0]*10, hip[1] + pw[1]*8 + up[1]*10, ...pts[2]);

    g.strokeStyle = 'rgba(30,45,20,.55)'; g.lineWidth = .8; g.beginPath(); g.moveTo(hip[0] + pw[0]*3 + up[0]*3, hip[1] + pw[1]*3 + up[1]*3); g.lineTo(neck[0] + pw[0]*3.5, neck[1] + pw[1]*3.5); g.stroke();
    g.fillStyle = 'rgba(40,58,26,.5)'; g.beginPath(); g.ellipse(hip[0] + pw[0]*1.5 + up[0]*14, hip[1] + pw[1]*1.5 + up[1]*14, 2.6, 2.2, P.lean, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#4a3018'; g.lineWidth = 1.7; g.beginPath(); g.moveTo(neck[0] - pw[0]*5, neck[1] - pw[1]*5); g.lineTo(hip[0] - pw[0]*3 + up[0]*6, hip[1] - pw[1]*3 + up[1]*6); g.stroke();

  limb(g, neck[0] + 2, neck[1] + 1, hc[0], hc[1] + 3, 3.4, 3.2, C.skin, .6);

  g.fillStyle = '#fff'; g.beginPath(); g.ellipse(3.9, -1.6, 1.7, 1.25, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#1c120c'; g.beginPath(); g.arc(4.7, -1.5, .85, 0, Math.PI*2); g.fill();
  g.strokeStyle = '#24160d'; g.lineWidth = 1.1; g.beginPath(); g.moveTo(2, -4.2); g.quadraticCurveTo(4.2, -5.6, 6.2, -4.1); g.stroke();
  g.fillStyle = '#3a1410'; g.beginPath(); g.ellipse(5.2, 3.3, 1.5, 1.1, 0, 0, Math.PI*2); g.fill();               // open mouth (panting)
  g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(1.5, -4.2, 8, 2.4, 0, 0, Math.PI*2); g.fill();            // brim shadow
  // safari hat
  const hg = g.createLinearGradient(0, -14, 0, -4); hg.addColorStop(0, shade(C.hat, .25)); hg.addColorStop(1, shade(C.hat, -.25));

  g.restore();
}

/* ===== the monster (Mapinguari-style jungle beast) ===== */
const BEAST = { fur:'#3b2216', far:'#21130c', claw:'#efe4c8', rim:'#86603f' };
const BODY = [[-84,-86],[[-92,-118],[-80,-146],[-50,-152]],[[-20,-160],[18,-156],[38,-138]],[[56,-122],[66,-104],[58,-86]],
              [[50,-66],[30,-56],[6,-58]],[[-20,-58],[-46,-56],[-62,-64]],[[-76,-70],[-80,-78],[-84,-86]]];
function bez(p0, c1, c2, p1, t){ const u = 1-t; return [u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p1[0], u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p1[1]]; }
function bodyPath(g){ g.beginPath(); g.moveTo(...BODY[0]); for (let i=1;i<BODY.length;i++) g.bezierCurveTo(...BODY[i][0], ...BODY[i][1], ...BODY[i][2]); g.closePath(); }
const FUR = (() => {               // fixed strand layout so fur doesn't shimmer between frames
  const r = rng(907), edge = [], inner = [];
  let prev = BODY[0];
  for (let i=1;i<BODY.length;i++){ const [c1,c2,p1] = BODY[i];
    for (let k=0;k<34;k++){ const t = k/34, a = bez(prev,c1,c2,p1,t), b = bez(prev,c1,c2,p1,t+.01);
      let nx = b[1]-a[1], ny = -(b[0]-a[0]); const L = Math.hypot(nx,ny)||1; nx/=L; ny/=L;
      if ((a[0]+12)*nx + (a[1]+104)*ny < 0){ nx=-nx; ny=-ny; }
      const bottom = ny > .45, len = bottom ? 10 + r()*12 : 6 + r()*10;
      edge.push({ x:a[0], y:a[1], dx: nx*.7 - .55 + (r()-.5)*.3, dy: ny*.8 + (bottom ? .6 : .05), len, c: r(), w: 1.4 + r()*1.4 }); }
    prev = p1; }
  for (let i=0;i<420;i++){ const a = r()*Math.PI*2, d = Math.sqrt(r());
    inner.push({ x: -12 + Math.cos(a)*64*d, y: -106 + Math.sin(a)*40*d, len: 5 + r()*8, ang: 2.3 + (r()-.5)*.5, c: r() }); }
  const mane = []; for (let i=0;i<70;i++){ const a = -2.9 + r()*2.6; mane.push({ a, len: 9 + r()*12, c: r(), w: 1.5 + r()*1.5 }); }
  return { edge, inner, mane };
})();
function furStroke(g, x, y, dx, dy, len, col, w){
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y);
  g.quadraticCurveTo(x + dx*len*.6 + dy*1.5, y + dy*len*.6 - dx*1.5, x + dx*len, y + dy*len); g.stroke();
}
function beastArm(g, sx, sy, aA, eA, far){
  const col = far ? BEAST.far : BEAST.fur, e = jp(sx, sy, aA, 36), fA = aA + eA, h = jp(e[0], e[1], fA, 34);
  limb(g, sx, sy, e[0], e[1], 15, 11, col, 1);
  limb(g, e[0], e[1], h[0], h[1], 11, 8.5, col, 1);
  const r = rng(far ? 5 : 6);
  for (let i=0;i<14;i++){ const t = r(), px = lerp(sx, h[0], t), py = lerp(sy, h[1], t) + 6 + r()*4;
    furStroke(g, px, py, -.5, .85, 6 + r()*7, far ? '#160c07' : (r() < .5 ? '#2a170e' : '#55361f'), 1.6); }
  blob(g, h[0], h[1], 9, 7.5, fA, col, .3, -.6, 1);
  for (let k=0;k<3;k++){                                        // sloth-like hooked claws
    const bx = h[0] + Math.sin(fA)*5 - k*1.5, by = h[1] + Math.cos(fA)*5 + (k-1)*3.6, d = fA + .35 + k*.12;
    const tip = jp(bx, by, d, 21), ctl = jp(bx, by, d - .55, 13);
    const cg = g.createLinearGradient(bx, by, tip[0], tip[1]); cg.addColorStop(0, far ? '#9c917a' : BEAST.claw); cg.addColorStop(1, '#2a2218');
    g.fillStyle = cg; g.beginPath(); g.moveTo(bx - 2, by - 1.5); g.quadraticCurveTo(ctl[0], ctl[1], tip[0], tip[1]);
    g.quadraticCurveTo(ctl[0] + 2.5, ctl[1] + 3, bx + 2, by + 2); g.closePath(); g.fill();
  }
}
function beastLeg(g, hx, hy, tA, bend, far){
  const col = far ? BEAST.far : BEAST.fur, k = jp(hx, hy, tA, 38), sA = tA - bend, an = jp(k[0], k[1], sA, 33), fA = sA + 1.25, toe = jp(an[0], an[1], fA, 20);
  limb(g, hx, hy, k[0], k[1], 22, 14, col, 1);
  limb(g, k[0], k[1], an[0], an[1], 13, 8, col, 1);
  limb(g, an[0], an[1], toe[0], toe[1], 9, 7, shade(col, -.1), 1);
  const r = rng(far ? 7 : 8);
  for (let i=0;i<16;i++){ const t = r()*.7, px = lerp(hx, an[0], t) - 10, py = lerp(hy, an[1], t);
    furStroke(g, px, py, -.8, .6, 8 + r()*8, far ? '#140b06' : (r() < .5 ? '#26150d' : '#4f331e'), 1.8); }
  g.fillStyle = far ? '#7c7260' : '#d8ccb0';
  for (let c=0;c<3;c++){ const b = jp(toe[0], toe[1], fA, 2), tip = jp(b[0], b[1] + (c-1)*3, fA + .6, 9);
    g.beginPath(); g.moveTo(b[0], b[1] + (c-1)*3 - 1.8); g.lineTo(tip[0], tip[1]); g.lineTo(b[0], b[1] + (c-1)*3 + 1.8); g.fill(); }
}
function beastHead(g, open){
  g.save(); g.translate(66, -110); g.rotate(.12);
  // mane / neck fur
  blob(g, -6, 6, 28, 30, 0, '#2a170e', -.2, -.6, 0);
  for (const m of FUR.mane){ const x = Math.cos(m.a)*25 - 6, y = Math.sin(m.a)*27 + 4;
    furStroke(g, x, y, Math.cos(m.a)*.6 - .6, Math.sin(m.a)*.6 + .3, m.len, m.c < .35 ? '#7a5234' : m.c < .7 ? '#3e2416' : '#1b0f09', m.w); }
  // mouth interior + lower jaw (behind skull)
  g.save(); g.translate(12, 6); g.rotate(open*.55);
  const mg = g.createLinearGradient(0, 0, 0, 16); mg.addColorStop(0, '#250404'); mg.addColorStop(1, '#6e1212');
  g.fillStyle = mg; g.beginPath(); g.moveTo(0, -2); g.lineTo(36, -2); g.quadraticCurveTo(34, 10, 24, 12); g.quadraticCurveTo(10, 12, 0, 6); g.fill();
  g.fillStyle = '#a63a44'; g.beginPath(); g.ellipse(18, 7, 10, 3.5, .1, 0, Math.PI*2); g.fill();                     // tongue
  blob(g, 16, 10, 20, 6.5, .08, '#3a2216', .2, -.8, 1);                                                             // lower jaw
  g.fillStyle = '#efe6cf'; for (const [x,l] of [[30,8],[21,6],[11,4.5]]){ g.beginPath(); g.moveTo(x-2.2, 5); g.lineTo(x+.3, 5-l); g.lineTo(x+2.2, 5); g.fill(); }
  g.restore();
  // skull + muzzle
  blob(g, 8, -6, 25, 21, .12, '#3d2418', .35, -.65, 1);
  blob(g, 31, 2, 19, 11.5, .05, '#4a2c1d', .2, -.8, 1);
  // ears
  for (const [x, s] of [[-6, .8], [4, 1]]){ g.fillStyle = s < 1 ? '#1e110a' : '#2f1b11'; g.beginPath(); g.moveTo(x - 5*s, -20); g.lineTo(x - 2*s, -33*s); g.lineTo(x + 5*s, -21); g.fill(); }
  // fur tufts on skull
  const r = rng(77); for (let i=0;i<26;i++){ const a = -2.6 + r()*1.9, x = 8 + Math.cos(a)*23, y = -6 + Math.sin(a)*19;
    furStroke(g, x, y, Math.cos(a)*.4 - .8, Math.sin(a)*.4 + .2, 6 + r()*6, r() < .4 ? '#86603f' : '#2b180f', 1.4); }
  // heavy brow ridge + eye sockets
  g.fillStyle = 'rgba(8,4,2,.75)'; g.beginPath(); g.ellipse(25, -8, 7.5, 4.6, .15, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(13, -7, 4.6, 3.6, .1, 0, Math.PI*2); g.fill();
  g.strokeStyle = '#120905'; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(4, -16); g.quadraticCurveTo(20, -18, 34, -11); g.stroke();
  // eyes (base colour; glow is added live)
  g.fillStyle = '#ffb22e'; g.beginPath(); g.ellipse(26, -8, 3.4, 2.3, .1, 0, Math.PI*2); g.fill();
  g.fillStyle = '#c96a12'; g.beginPath(); g.ellipse(13.5, -7, 2.2, 1.6, .1, 0, Math.PI*2); g.fill();
  g.fillStyle = '#1a0800'; g.beginPath(); g.ellipse(26.6, -8, .9, 2, 0, 0, Math.PI*2); g.fill();
  // nose
  g.fillStyle = '#120806'; g.beginPath(); g.ellipse(48, -2, 4.8, 3.4, .2, 0, Math.PI*2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(47, -3.4, 1.5, .8, 0, 0, Math.PI*2); g.fill();
  // snarl wrinkles + scar
  g.strokeStyle = 'rgba(15,8,4,.7)'; g.lineWidth = 1.1;
  for (let i=0;i<3;i++){ g.beginPath(); g.moveTo(30 + i*4, -6 + i*.5); g.quadraticCurveTo(33 + i*4, -3, 31 + i*4, 0); g.stroke(); }
  g.strokeStyle = 'rgba(200,160,120,.45)'; g.lineWidth = 1; g.beginPath(); g.moveTo(16, -14); g.lineTo(22, 2); g.stroke();
  // upper lip + fangs
  g.strokeStyle = '#140a06'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(14, 7); g.quadraticCurveTo(30, 11, 47, 6); g.stroke();
  const fg = g.createLinearGradient(0, 6, 0, 22); fg.addColorStop(0, '#fbf5e4'); fg.addColorStop(1, '#bfae88'); g.fillStyle = fg;
  for (const [x, l] of [[42, 14], [33, 11], [24, 6], [18, 5]]){ g.beginPath(); g.moveTo(x - 2.6, 7.5); g.quadraticCurveTo(x - 1.2, 7.5 + l*.7, x - .6, 7.5 + l); g.lineTo(x + 2.6, 8); g.fill(); }
  // drool
  g.strokeStyle = 'rgba(220,235,240,.55)'; g.lineWidth = 1; g.beginPath(); g.moveTo(40, 12); g.quadraticCurveTo(41.5, 18 + open*8, 39.5, 24 + open*10); g.stroke();
  g.restore();
}
function drawBeast(g, q, lunge){
  const bob = -Math.abs(Math.sin(q))*6, pitch = .05*Math.sin(q*2);
  const aF = lunge ? 1.4 : .75 + .7*Math.sin(q + Math.PI), aB = lunge ? 1.2 : .75 + .7*Math.sin(q);
  g.save(); g.translate(0, bob); g.rotate(pitch);
  beastLeg(g, -46, -76, .15 + .7*Math.sin(q + Math.PI), .7 + .8*Math.max(0, Math.cos(q + Math.PI)), true);
  beastArm(g, 6, -96, aB, lunge ? .15 : .95, true);
  // body: shaded mass + fur
  bodyPath(g); const bg = g.createLinearGradient(0, -160, 10, -55);
  bg.addColorStop(0, '#7b5437'); bg.addColorStop(.22, '#4b2d1c'); bg.addColorStop(.6, '#2b1810'); bg.addColorStop(1, '#130a06');
  g.fillStyle = bg; g.fill();
  const rg = g.createRadialGradient(10, -140, 4, 10, -130, 70); rg.addColorStop(0, 'rgba(160,120,80,.35)'); rg.addColorStop(1, 'rgba(160,120,80,0)');
  g.fillStyle = rg; g.fill();
  for (const f of FUR.inner){ const col = f.c < .3 ? 'rgba(120,84,55,.55)' : f.c < .75 ? 'rgba(25,14,8,.55)' : 'rgba(70,44,28,.6)';
    furStroke(g, f.x, f.y, Math.cos(f.ang)*-1, Math.sin(f.ang), f.len, col, 1.3); }
  for (const f of FUR.edge){ const top = f.y < -120, col = top ? (f.c < .5 ? BEAST.rim : '#5a3a25') : f.c < .5 ? '#2a170e' : '#1a0e08';
    furStroke(g, f.x, f.y, f.dx, f.dy, f.len, col, f.w); }
  beastHead(g, lunge ? 1 : .45 + .3*Math.sin(q*.5));
  beastLeg(g, -46, -76, .15 + .7*Math.sin(q), .7 + .8*Math.max(0, Math.cos(q)), false);
  beastArm(g, 16, -90, aF, lunge ? .1 : .95, false);
  g.restore();
  return { bob, pitch };
}

/* ===== sprite cache ===== */
const SPR = { man: {}, beast: [], lunge: null };
const MAN_BOX = { w: 110, h: 112, ax: 46, ay: 100 }, BEAST_BOX = { w: 360, h: 250, ax: 125, ay: 236 }, RUN_N = 12, BEAST_N = 10, MAN_K = 1.2, BEAST_K = 1.1;
function sprite(box, fn, k){
  const c = document.createElement('canvas'); c.width = Math.ceil(box.w*S*k); c.height = Math.ceil(box.h*S*k);
  const g = c.getContext('2d'); g.scale(S*k, S*k); g.translate(box.ax, box.ay); g.lineJoin = 'round'; fn(g); return c;
}
function buildSprites(){
  SPR.man.run = []; for (let i=0;i<RUN_N;i++) SPR.man.run.push(sprite(MAN_BOX, g => drawMan(g, manPose('run', i/RUN_N*Math.PI*2)), MAN_K));
  for (const k of ['jump','fall','slide']) SPR.man[k] = sprite(MAN_BOX, g => drawMan(g, manPose(k, 0)), MAN_K);
  SPR.beast = []; for (let i=0;i<BEAST_N;i++) SPR.beast.push(sprite(BEAST_BOX, g => drawBeast(g, i/BEAST_N*Math.PI*2, false), BEAST_K));
  SPR.lunge = sprite(BEAST_BOX, g => drawBeast(g, .4, true), BEAST_K);
}

function drawPlayer(){
  const x = P.x, y = P.y, sliding = P.duck && !P.air;

function draw(){

  const sx = shake ? (R()-.5)*10*shake : 0, sy = shake ? (R()-.5)*8*shake : 0;
  ctx.save(); ctx.translate(sx, sy);
  drawSky();
  for (const L of layers) drawLayer(L);
  drawLayer(groundTile);
  for (const f of fruits) drawFruit(f);
  for (const o of obs) drawObstacle(o);
  drawMonster();
  drawPlayer();
  drawParticles();
  drawLayer(fore);
  if (state === 'play' && speed > 560){ const a = Math.min(.22, (speed - 560)/1600);
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 1.2;
    for (let i=0;i<9;i++){ const y = 40 + ((i*89 + Math.floor(time*6)*37) % 250), x = W - ((time*speed*1.6 + i*173) % (W + 200)); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 60 + (i%3)*30, y); ctx.stroke(); } }
  for (const q of pops){ const a = 1 - q.t/1.1; ctx.globalAlpha = a; ctx.font = '800 16px system-ui,-apple-system,Segoe UI,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText(q.text, q.x + 1, q.y - q.t*34 + 1); ctx.fillStyle = q.col; ctx.fillText(q.text, q.x, q.y - q.t*34); ctx.globalAlpha = 1; }

  const danger = state === 'play' ? clamp((.35-gap)/.35,0,1) : 0;
  if (danger > 0 || flash > 0){ const v = ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.75);
    v.addColorStop(0,'rgba(180,0,0,0)'); v.addColorStop(1,`rgba(200,20,20,${Math.max(danger*(.45+.15*Math.sin(time*8)), flash*.5)})`);
    ctx.fillStyle=v; ctx.fillRect(-20,-20,W+40,H+40); }
  ctx.restore();
  drawHUD();
  if (state === 'ready') overlay('Jungle Escape', ['Run through the Amazon and outrun the monster.', best ? `Jump logs · slide under branches · grab mangoes  ·  Best ${best} m` : 'Jump logs · slide under branches · grab mangoes'], touch ? 'Tap to start' : 'Press Space to start');

  if (state === 'over' && caughtT > .6) overlay('Caught!', [`You ran ${Math.floor(dist/40)} m` + (newBest ? '  ·  New best! 🏆' : `  ·  Best ${best} m`)], caughtT > .9 ? (touch ? 'Tap to run again' : 'Press Space to run again') : '');

/* ---------- loop ---------- */
let last = performance.now(), paused = false;
let errShown = false;
function frame(now){
  const dt = Math.min(.033, (now - last)/1000); last = now;
  try { if (!paused) { if (!SPR.beast.length) resize(); update(dt); draw(); } }
  catch(e){ if (!errShown){ errShown = true; console.error('Jungle Escape:', e); } }
  requestAnimationFrame(frame);
}

  else if (['ArrowDown','KeyS'].includes(e.code)){ e.preventDefault(); keys.duck = true; if (state==='ready') start(); }
  else if (e.code === 'Enter' && state !== 'play') jump();
